[project]
name = "qfo-backend"
version = "1.0.2"
description = "QFO 量化投研平台后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.5.0",
    # 数据源
    "akshare>=1.12.95",
    "tushare>=1.4.1",
    "baostock>=0.8.8",
    # 数据处理
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    # 模板引擎
    "jinja2>=3.1.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    # mypy>=1.10.0  # 待 QFO 代码完成类型注解后启用，同步取消下方 [tool.mypy] 段注释
]

[tool.uv]
# 扁平模块布局（main.py + core/ + routers/ ...），不作为可安装包构建，仅用于依赖同步
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/ 中的用例直接 from utils.xxx 导入，需将 backend/ 加入 sys.path
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
# HTML 报告中显示每条覆盖来自哪个测试
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # 行宽由 line-length 控制，历史代码暂不强制
]

# 类型检查：待代码完成类型注解后取消注释并启用 dev 组中的 mypy
