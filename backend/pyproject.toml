[project]
name = "qfo-backend"
version = "1.0.2"
description = "QFO 量化投研平台后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.5.0",
    # 数据源
    "akshare>=1.12.95",
    "tushare>=1.4.1",
    "baostock>=0.8.8",
    # 数据处理
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    # 模板引擎
    "jinja2>=3.1.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
# 扁平模块布局（main.py + core/ + routers/ ...），不作为可安装包构建，仅用于依赖同步
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/ 中的用例直接 from utils.xxx 导入，需将 backend/ 加入 sys.path
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
# HTML 报告中显示每条覆盖来自哪个测试
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # 行宽由 line-length 控制，历史代码暂不强制
    "E402",  # 存量模块存在日志初始化后 import / 文档后置等结构，历史代码暂不强制
    "B008",  # FastAPI 的 Query(...)/Depends(...) 默认参数惯用法
    "E711",  # SQLAlchemy 列比较 `== None` 惯用法，改写 .is_(None) 有 NULL 语义差异风险
    "E712",  # SQLAlchemy 列比较 `== True` 惯用法，改写 .is_(True) 有 NULL 语义差异风险
]

# 类型检查基线：已修复存量错误使 mypy 通过；strict 模式待全量函数注解完成后渐进启用
[tool.mypy]
python_version = "3.12"
# 未注解的函数体内也执行类型检查（strict 的前置台阶）
check_untyped_defs = true
# 防止无源的 type: ignore 长期潜伏
warn_unused_ignores = true
# 扁平模块布局（main.py + core/ + ...），无顶层包名，需显式以当前目录为包基
explicit_package_bases = true
exclude = ["venv", ".venv", "htmlcov", "scripts", "tests"]

[[tool.mypy.overrides]]
# 以下第三方库无类型存根
module = ["akshare.*", "tushare.*", "baostock.*", "pandas.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
